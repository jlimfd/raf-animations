<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Return Visit Ring Compare</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 32px 16px 48px;
  }
  header { max-width: 1300px; margin: 0 auto 28px; text-align: center; }
  h1 { font-size: 20px; font-weight: 700; }
  header p { margin-top: 6px; color: #a1a1a6; font-size: 14px; line-height: 1.45; }
  .grid { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }
  figure { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  figcaption { text-align: center; }
  figcaption b { display: block; font-size: 15px; }
  figcaption span { display: block; margin-top: 3px; color: #a1a1a6; font-size: 13px; }
  .tag { display: inline-block; margin-top: 8px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
         background: rgba(79,191,116,.12); color: #4fbf74; box-shadow: inset 0 0 0 1px rgba(79,191,116,.25); }
  /* Crop each frame to the top of the screen, where the card lives, at 1:1 scale. */
  .frame { width: 393px; height: 452px; overflow: hidden; border-radius: 40px 40px 16px 16px; box-shadow: 0 0 0 1px #2c2c2e; }
  /* 520px wide keeps the prototype above its 480px phone breakpoint; offsets crop to the device. */
  .frame iframe { width: 520px; height: 900px; border: 0; margin: -24px 0 0 -63.5px; display: block; }
  @media (max-width: 440px) { .frame { width: 100%; } }
</style>
</head>
<body>
  <header>
    <h1>Return visit: resting border on the reward card</h1>
    <p>All three show the finished state someone sees when they come back. The coloured comet only appears during the first-visit celebration.</p>
  </header>
  <div class="grid">
    <figure>
      <div class="frame"><iframe src="index.html?view=return" title="Neutral hairline"></iframe></div>
      <figcaption>
        <b>A · Neutral hairline</b>
        <span>White at 20%, matches the end of the first visit</span>
      </figcaption>
    </figure>
    <figure>
      <div class="frame"><iframe src="index.html?view=return&ring=green" title="Faint green hairline"></iframe></div>
      <figcaption>
        <b>B · Faint green hairline</b>
        <span>Success green at 35%, a quiet "earned" mark</span>
      </figcaption>
    </figure>
    <figure>
      <div class="frame"><iframe src="index.html?view=return&ring=none" title="No border"></iframe></div>
      <figcaption>
        <b>C · No border</b>
        <span>Ring is only the celebration; card rests like the others</span>
        <span class="tag">Recommended</span>
      </figcaption>
    </figure>
  </div>
</body>
</html>
